name: Site check

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Let the Pages deploy finish and the CDN catch up
        if: github.event_name == 'push'
        run: sleep 90
      - name: Check pages, assets and CNAME
        run: bash scripts/check-site.sh
